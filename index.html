<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2f3fc4" />
<title>RIF TAP STOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#4a5cf0;
    --brand-deep:#2f3fc4;
    --brand-dark:#1a2380;
    --accent:#3ee0ff;
    --gold:#ffd54a;
    --green:#4dffa6;
    --red:#ff6b6b;
    --txt-black:#111318;
    --txt-dark:#1c2030;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
    color:var(--txt-black);
    background-color: var(--brand-deep);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(143,240,255,.35) 0%, transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(255,213,74,.20) 0%, transparent 50%),
      linear-gradient(165deg, #6a78ff 0%, var(--brand) 45%, var(--brand-deep) 100%);
    background-attachment: fixed;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    position:relative;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 68% 12%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 42% 62%, rgba(255,255,255,.8), transparent),
      radial-gradient(2px 2px at 88% 48%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 8% 78%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 55% 88%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 30% 35%, rgba(255,255,255,.5), transparent);
    background-size: 260px 260px, 300px 300px, 220px 220px, 340px 340px, 280px 280px, 240px 240px, 320px 320px;
    animation: starDrift 90s linear infinite;
    pointer-events:none;
    opacity:.8;
    z-index:0;
  }
  @keyframes starDrift{
    from{ transform:translateY(0); }
    to{ transform:translateY(-260px); }
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    gap:8px;
    position:relative;
    z-index:10;
    flex-shrink:0;
  }

  .user-chip{
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 12px 5px 6px;
    background:rgba(255,255,255,.92);
    border:1px solid rgba(0,0,0,.12);
    border-radius:50px;
    max-width:55%;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
  }
  .user-chip .avatar{
    width:34px; height:34px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--brand);
    box-shadow:0 0 10px rgba(74,92,240,.5);
    flex-shrink:0;
    background:#dde3ff;
  }
  .user-chip .meta{
    display:flex; flex-direction:column; line-height:1.15; min-width:0;
  }
  .user-chip .name{
    font-size:12.5px;
    font-weight:800;
    color:var(--txt-black);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:110px;
  }
  .user-chip .sub{
    font-size:9px;
    color:#5a6380;
    font-family:'Orbitron',sans-serif;
    letter-spacing:.5px;
  }

  .header-right{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }

  .lang-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,.15);
    background:rgba(255,255,255,.92);
    color:var(--txt-black);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.2);
    transition:transform .12s;
    flex-shrink:0;
  }
  .lang-btn:active{ transform:scale(.9); }

  .tether-chip{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 13px;
    background:linear-gradient(145deg, #e8fff5, #b8f5dc);
    border:1px solid #1a8f68;
    border-radius:50px;
    box-shadow:0 4px 14px rgba(13,128,101,.3);
    font-weight:800;
    font-size:13px;
    font-family:'Orbitron',sans-serif;
    direction:ltr;
    color:#0a3d2c;
    flex-shrink:0;
  }
  .tether-chip .usdt-icon{ width:20px; height:20px; flex-shrink:0; }

  .title-section{
    text-align:center;
    padding:2px 16px 4px;
    position:relative;
    z-index:10;
    flex-shrink:0;
  }

  .logo-ring{
    width:86px; height:86px;
    margin:0 auto 8px;
    border-radius:50%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    border:3px solid rgba(255,255,255,.9);
    box-shadow:
      0 0 30px rgba(255,255,255,.6),
      0 8px 24px rgba(0,0,0,.3);
    animation: logoFloat 3.2s ease-in-out infinite;
  }
  .logo-ring::after{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.4), transparent 65%);
    animation:haloPulse 2.4s ease-in-out infinite;
    z-index:-1;
    pointer-events:none;
  }
  @keyframes haloPulse{
    0%,100%{ transform:scale(1); opacity:.5; }
    50%{ transform:scale(1.25); opacity:.9; }
  }
  @keyframes logoFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }

  .logo-ring .logo-img{
    width:72px; height:72px;
    border-radius:50%;
    display:block;
  }

  .title-section h1{
    font-family:'Orbitron',sans-serif;
    font-size:20px;
    font-weight:900;
    letter-spacing:2.5px;
    color:#fff;
    text-shadow:
      0 2px 6px rgba(0,0,0,.4),
      0 0 18px rgba(255,255,255,.5),
      0 0 30px rgba(255,213,74,.4);
    line-height:1.2;
  }

  .price-line{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
    padding:4px 14px;
    background:#fff;
    border:1px solid rgba(0,0,0,.1);
    border-radius:20px;
    font-family:'Orbitron',sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--txt-black);
    box-shadow:0 3px 12px rgba(0,0,0,.2);
  }
  .price-line .change{ font-size:10px; font-weight:700; }
  .price-line .change.up{ color:#0a9d5c; }
  .price-line .change.down{ color:#d63030; }

  .counter-area{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:10;
    padding:8px 16px;
    min-height:0;
  }

  .tap-wrapper{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .tap-wrapper::before{
    content:"";
    position:absolute;
    width:270px; height:270px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.25), transparent 65%);
    animation:haloPulse 3s ease-in-out infinite;
    pointer-events:none;
    z-index:-1;
  }

  .tap-btn{
    position:relative;
    width:190px;
    height:190px;
    border-radius:50%;
    border:4px solid #fff;
    cursor:pointer;
    background:
      radial-gradient(circle at 34% 26%, #8fb4ff 0%, var(--brand) 40%, var(--brand-deep) 75%, var(--brand-dark) 100%);
    box-shadow:
      0 18px 44px rgba(0,10,40,.55),
      0 0 0 6px rgba(255,255,255,.15),
      0 0 0 12px rgba(255,255,255,.08),
      inset 0 -10px 24px rgba(0,0,0,.4),
      inset 0 10px 24px rgba(255,255,255,.3),
      0 0 40px rgba(255,255,255,.3);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    transition:transform .1s cubic-bezier(.34,1.56,.64,1), box-shadow .1s;
    color:#fff;
    font-family:'Orbitron',sans-serif;
    overflow:hidden;
    outline:none;
    animation: btnBreathe 3.2s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
  }

  @keyframes btnBreathe{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-4px) scale(1.015); }
  }

  .tap-btn:active{
    transform:scale(.92) !important;
    box-shadow:
      0 8px 20px rgba(0,10,40,.6),
      0 0 0 6px rgba(255,255,255,.25),
      0 0 0 12px rgba(255,255,255,.12),
      inset 0 -6px 18px rgba(0,0,0,.5),
      inset 0 6px 18px rgba(255,255,255,.35),
      0 0 70px rgba(143,240,255,.6);
    transition-duration:.06s;
  }

  .tap-btn::after{
    content:"";
    position:absolute;
    top:8%; left:15%;
    width:70%; height:35%;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(255,255,255,.4), transparent 70%);
    pointer-events:none;
    filter:blur(2px);
  }

  .tap-btn .reef-icon{
    width:44px; height:44px;
    margin-bottom:1px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));
    position:relative;
    z-index:1;
  }
  .tap-btn .count{
    font-size:42px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 10px rgba(0,0,0,.6), 0 0 24px rgba(255,255,255,.6);
    letter-spacing:1px;
    transition:transform .08s ease;
    position:relative;
    z-index:1;
  }
  .tap-btn .count.bump{ transform:scale(1.15); }
  .tap-btn .label{
    font-size:10px;
    letter-spacing:.8px;
    opacity:.95;
    font-family:'Vazirmatn',sans-serif;
    font-weight:700;
    margin-top:2px;
    position:relative;
    z-index:1;
  }

  .pulse-ring{
    position:absolute;
    width:190px; height:190px;
    border-radius:50%;
    border:3px solid #fff;
    pointer-events:none;
    animation:pulseOut .65s ease-out forwards;
    z-index:20;
    box-shadow:0 0 20px rgba(255,255,255,.8);
  }
  @keyframes pulseOut{
    0%{ transform:scale(1); opacity:.9; }
    100%{ transform:scale(1.8); opacity:0; }
  }

  .float-plus{
    position:fixed;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:26px;
    color:var(--gold);
    text-shadow:0 0 14px rgba(255,213,74,.9), 0 2px 6px rgba(0,0,0,.6);
    pointer-events:none;
    animation:floatUp .9s ease-out forwards;
    z-index:99;
    transform:translate(-50%,-50%);
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(.7); }
    30%{ opacity:1; transform:translate(-50%,-80%) scale(1.2); }
    100%{ opacity:0; transform:translate(-50%,-180%) scale(1.35); }
  }

  .stats-bar{
    display:flex;
    gap:10px;
    padding:8px 16px 10px;
    position:relative;
    z-index:10;
    flex-shrink:0;
  }

  .stat-card{
    flex:1;
    background:#fff;
    border:1px solid rgba(0,0,0,.1);
    border-radius:16px;
    padding:9px 10px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    position:relative;
    overflow:hidden;
  }
  .stat-card .lbl{
    font-size:10px;
    color:#5a6380;
    margin-bottom:2px;
    font-weight:700;
  }
  .stat-card .val{
    font-family:'Orbitron',sans-serif;
    font-size:15px;
    font-weight:800;
    color:var(--txt-black);
    letter-spacing:.5px;
  }
  .stat-card.gold .val{ color:#b8860b; }
  .stat-card.green .val{ color:#0a7d4a; }

  .bottom-bar{
    padding:0 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    gap:10px;
    position:relative;
    z-index:10;
    flex-shrink:0;
  }

  .action-btn{
    flex:1;
    padding:12px 10px;
    border-radius:14px;
    border:1px solid rgba(0,0,0,.1);
    background:#fff;
    color:var(--txt-black);
    font-family:'Vazirmatn',sans-serif;
    font-size:13px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    transition:transform .12s, background .2s;
  }
  .action-btn:active{
    transform:scale(.96);
    background:#f0f2ff;
  }
  .action-btn .icon{ font-size:16px; line-height:1; }

  .action-btn.danger{
    background:#fff0f0;
    color:#c62828;
    border-color:rgba(198,40,40,.2);
  }
  .action-btn.danger:active{ background:#ffe0e0; }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,5,20,.7);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:24px;
    opacity:0;
    transition:opacity .25s;
  }
  .modal-overlay.show{ display:flex; opacity:1; }

  .modal-box{
    background:#fff;
    border-radius:22px;
    padding:24px 22px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 24px 64px rgba(0,0,0,.6);
    animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
    color:var(--txt-black);
  }
  @keyframes popIn{
    from{ transform:scale(.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .modal-box .modal-icon{
    width:52px; height:52px;
    margin:0 auto 10px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    background:#fff8e0;
    border:1px solid #e0c060;
  }
  .modal-box.danger .modal-icon{
    background:#ffe8e8;
    border-color:#e08080;
  }

  .modal-box h3{
    margin:0 0 10px;
    font-family:'Vazirmatn',sans-serif;
    font-size:16px;
    font-weight:900;
    color:var(--txt-black);
  }
  .modal-box.danger h3{ color:#c62828; }

  .modal-box p{
    margin:0 0 18px;
    font-size:13.5px;
    color:var(--txt-dark);
    line-height:1.9;
  }
  .modal-box p b{ color:var(--brand-deep); font-weight:900; }

  .modal-box .modal-actions{
    display:flex;
    gap:8px;
  }
  .modal-box .modal-actions button{
    flex:1;
    padding:12px 10px;
    border-radius:13px;
    border:none;
    font-family:'Vazirmatn',sans-serif;
    font-size:13.5px;
    font-weight:900;
    cursor:pointer;
    transition:transform .12s, opacity .2s;
  }
  .modal-box .modal-actions button:active{ transform:scale(.96); }
  .modal-box .modal-actions .btn-cancel{
    background:#eef0f8;
    color:var(--txt-black);
    border:1px solid rgba(0,0,0,.08);
  }
  .modal-box .modal-actions .btn-primary{
    background:linear-gradient(135deg, var(--brand), #6a78ff);
    color:#fff;
    box-shadow:0 4px 16px rgba(74,92,240,.35);
  }
  .modal-box .modal-actions .btn-danger{
    background:linear-gradient(135deg, #e53935, #ff6b6b);
    color:#fff;
    box-shadow:0 4px 16px rgba(229,57,53,.3);
  }

  .lang-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:320px;
    overflow-y:auto;
    padding:2px;
    margin-bottom:14px;
  }
  .lang-list::-webkit-scrollbar{ width:4px; }
  .lang-list::-webkit-scrollbar-thumb{
    background:rgba(74,92,240,.4);
    border-radius:4px;
  }
  .lang-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,.08);
    background:#f5f6fc;
    color:var(--txt-black);
    font-family:'Vazirmatn',sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:all .15s;
  }
  .lang-item:active{ transform:scale(.98); }
  .lang-item.active{
    background:linear-gradient(135deg, #e8ecff, #d0d8ff);
    border-color:var(--brand);
    box-shadow:0 0 12px rgba(74,92,240,.25);
  }
  .lang-item .flag{ font-size:22px; flex-shrink:0; }
  .lang-item .lang-name{ flex:1; text-align:right; }
  .lang-item .check{
    width:20px; height:20px;
    border-radius:50%;
    background:var(--brand);
    color:#fff;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
    flex-shrink:0;
  }
  .lang-item.active .check{ display:flex; }

  .toast{
    position:fixed;
    top:76px;
    left:50%;
    transform:translateX(-50%) translateY(-16px);
    background:#fff;
    border:1px solid rgba(0,0,0,.1);
    color:var(--txt-black);
    padding:10px 20px;
    border-radius:30px;
    font-size:13px;
    font-weight:800;
    opacity:0;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    z-index:300;
    pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    white-space:nowrap;
    font-family:'Vazirmatn',sans-serif;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-height:680px){
    .logo-ring{ width:70px; height:70px; margin-bottom:5px; }
    .logo-ring .logo-img{ width:58px; height:58px; }
    .title-section h1{ font-size:16px; }
    .tap-btn{ width:160px; height:160px; }
    .tap-btn .count{ font-size:34px; }
    .tap-btn .reef-icon{ width:38px; height:38px; }
    .pulse-ring{ width:160px; height:160px; }
    .price-line{ font-size:11px; }
    .stats-bar{ padding:6px 14px 8px; }
    .bottom-bar{ padding:0 14px calc(10px + env(safe-area-inset-bottom)); }
    .action-btn{ padding:10px 8px; font-size:12px; }
  }
  @media (max-height:580px){
    .logo-ring{ width:56px; height:56px; }
    .logo-ring .logo-img{ width:46px; height:46px; }
    .title-section h1{ font-size:14px; letter-spacing:1.5px; }
    .tap-btn{ width:140px; height:140px; }
    .tap-btn .count{ font-size:28px; }
    .tap-btn .reef-icon{ width:30px; height:30px; }
    .tap-btn .label{ font-size:8.5px; }
    .pulse-ring{ width:140px; height:140px; }
    .stats-bar{ gap:6px; padding:4px 12px 6px; }
    .stat-card{ padding:6px 8px; border-radius:12px; }
    .stat-card .val{ font-size:13px; }
    .stat-card .lbl{ font-size:9px; }
    .user-chip{ padding:4px 10px 4px 5px; }
    .user-chip .avatar{ width:28px; height:28px; }
    .user-chip .name{ font-size:11px; }
    .tether-chip{ padding:5px 10px; font-size:11px; }
    .tether-chip .usdt-icon{ width:17px; height:17px; }
    .lang-btn{ width:32px; height:32px; font-size:14px; }
  }
</style>
</head>
<body>

<header>
  <div class="user-chip">
    <img class="avatar" id="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234a5cf0' width='100' height='100'/><circle cx='50' cy='37' r='17' fill='%23ffffff'/><ellipse cx='50' cy='88' rx='30' ry='22' fill='%23ffffff'/></svg>" alt="avatar"/>
    <div class="meta">
      <div class="name" id="userName" data-i18n="guest">کاربر مهمان</div>
      <div class="sub">RIF TAPPER</div>
    </div>
  </div>

  <div class="header-right">
    <button class="lang-btn" id="langBtn" title="Language">🌐</button>
    <div class="tether-chip" id="tetherChip" title="Withdrawal Fee">
      <img class="usdt-icon" src="https://cryptologos.cc/logos/tether-usdt-logo.svg?v=040" alt="USDT" onerror="this.style.display='none'"/>
      <span id="tetherVal">0.00</span>
    </div>
  </div>
</header>

<div class="title-section">
  <div class="logo-ring">
    <svg class="logo-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="50" fill="#4a5cf0"/>
      <path d="M24 22 H76 V50 H56 V40 H44 V50 Q44 60 34 60 H26 V50 H34 Q36 50 36 48 V40 H24 Z" fill="#ffffff"/>
      <circle cx="33" cy="72" r="7" fill="#ffffff"/>
    </svg>
